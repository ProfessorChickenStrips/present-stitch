<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Present Stitch Biz Dashboard</title>
<meta name="theme-color" content="#f9f9f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Present Stitch">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='none' stroke='%232a78d6' stroke-width='7'/%3E%3Cpath d='M20 38 Q32 22 44 34' fill='none' stroke='%23eb6834' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    color-scheme: light;
    --page:#f9f9f7; --surface-1:#fcfcfb;
    --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,0.10);
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
    --seq-250:#86b6ef; --seq-150:#b7d3f6; --seq-100:#cde2fb;
    --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
    --delta-good:#006300; --accent:#2a78d6;
    --wash:rgba(42,120,214,.10);
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --page:#0d0d0d; --surface-1:#1a1a19;
      --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
      --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,0.10);
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
      --seq-250:#1c5cab; --seq-150:#184f95; --seq-100:#104281;
      --delta-good:#0ca30c; --accent:#3987e5;
      --wash:rgba(57,135,229,.14);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page:#0d0d0d; --surface-1:#1a1a19;
    --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,0.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
    --seq-250:#1c5cab; --seq-150:#184f95; --seq-100:#104281;
    --delta-good:#0ca30c; --accent:#3987e5;
    --wash:rgba(57,135,229,.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background:var(--page); color:var(--ink-1);
    font-size:15px; line-height:1.45;
    padding-bottom:56px;
  }
  header.app{
    padding:18px 16px 10px; max-width:1080px; margin:0 auto;
  }
  header.app h1{font-size:20px; font-weight:700; letter-spacing:-.01em;}
  header.app .sub{color:var(--ink-2); font-size:13px; margin-top:2px;}
  .hdr-row{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .theme-btn{
    border:1px solid var(--ring); background:var(--surface-1); color:var(--ink-2);
    border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer; flex:none;
  }
  nav.tabs{
    position:sticky; top:0; z-index:30; background:var(--page);
    display:flex; gap:6px; overflow-x:auto; padding:8px 16px 10px;
    max-width:1080px; margin:0 auto; scrollbar-width:none;
    border-bottom:1px solid var(--grid);
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex:none; border:1px solid var(--ring); background:var(--surface-1);
    color:var(--ink-2); border-radius:999px; padding:7px 14px; font-size:13px;
    cursor:pointer; font-weight:500;
  }
  nav.tabs button.active{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
  main{max-width:1080px; margin:0 auto; padding:14px 12px 40px;}
  section.tab{display:none;}
  section.tab.active{display:block;}
  .card{
    background:var(--surface-1); border:1px solid var(--ring); border-radius:14px;
    padding:14px 14px 16px; margin-bottom:12px;
  }
  .card h2{font-size:15px; font-weight:650; margin-bottom:2px;}
  .card .note{color:var(--ink-2); font-size:12.5px; margin-bottom:8px;}
  .card h3{font-size:13.5px; font-weight:650; margin:12px 0 4px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .grid3{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  @media(min-width:760px){ .grid3{grid-template-columns:repeat(4,1fr);} }
  /* stat tiles */
  .tile{background:var(--surface-1); border:1px solid var(--ring); border-radius:12px; padding:10px 12px;}
  .tile .lbl{font-size:11.5px; color:var(--ink-2); font-weight:500;}
  .tile .val{font-size:22px; font-weight:650; letter-spacing:-.01em; margin-top:1px;}
  .tile .dlt{font-size:11.5px; margin-top:1px; color:var(--ink-3);}
  .tile .dlt.up{color:var(--delta-good);} .tile .dlt.down{color:var(--crit);}
  .hero{font-size:44px; font-weight:700; letter-spacing:-.02em; line-height:1.05;}
  @media(min-width:600px){ .hero{font-size:52px;} }
  .hero-sub{color:var(--ink-2); font-size:13px; margin-top:4px;}
  /* meter */
  .meter{height:10px; border-radius:6px; background:var(--seq-100); overflow:hidden; margin-top:8px;}
  .meter>i{display:block; height:100%; border-radius:6px; background:var(--accent);}
  /* controls */
  label.f{display:block; font-size:12px; color:var(--ink-2); font-weight:550; margin:8px 0 3px;}
  input[type=number], input[type=text], input[type=month], input[type=date], select, textarea{
    width:100%; border:1px solid var(--axis); background:var(--surface-1); color:var(--ink-1);
    border-radius:9px; padding:8px 10px; font-size:14px; font-family:inherit;
  }
  input[type=range]{width:100%; accent-color:var(--accent);}
  .seg{display:flex; gap:6px; flex-wrap:wrap;}
  .seg button{
    border:1px solid var(--ring); background:var(--surface-1); color:var(--ink-2);
    border-radius:8px; padding:6px 12px; font-size:12.5px; cursor:pointer;
  }
  .seg button.active{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}
  button.primary{
    background:var(--accent); color:#fff; border:none; border-radius:9px;
    padding:9px 14px; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  button.ghost{
    background:none; border:1px solid var(--ring); color:var(--ink-2); border-radius:9px;
    padding:8px 12px; font-size:12.5px; cursor:pointer;
  }
  /* legend */
  .legend{display:flex; flex-wrap:wrap; gap:8px 14px; margin:8px 0 2px;}
  .legend .k{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2);}
  .legend .sw{width:10px; height:10px; border-radius:3px; flex:none;}
  /* tables */
  table.data{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:6px;}
  table.data th{color:var(--ink-2); font-weight:600; text-align:right; padding:5px 6px; border-bottom:1px solid var(--grid); white-space:nowrap;}
  table.data td{padding:5px 6px; text-align:right; border-bottom:1px solid var(--grid); font-variant-numeric:tabular-nums; white-space:nowrap;}
  table.data th:first-child, table.data td:first-child{text-align:left;}
  .tscroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  /* checklists */
  ul.check{list-style:none;}
  ul.check li{display:flex; gap:9px; align-items:flex-start; padding:7px 0; border-bottom:1px solid var(--grid); font-size:13.5px;}
  ul.check li:last-child{border-bottom:none;}
  ul.check input{width:17px; height:17px; margin-top:1px; accent-color:var(--accent); flex:none;}
  ul.check li.done span{color:var(--ink-3); text-decoration:line-through;}
  .phase-head{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .pbar{height:6px; border-radius:4px; background:var(--seq-100); overflow:hidden; margin-top:6px;}
  .pbar>i{display:block; height:100%; background:var(--accent); border-radius:4px;}
  .badge{display:inline-block; font-size:11px; font-weight:650; border-radius:6px; padding:2px 7px; background:var(--wash); color:var(--accent);}
  .pill-warn{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; color:var(--ink-1); background:var(--surface-1); border:1px solid var(--ring); border-left:3px solid var(--warn); border-radius:8px; padding:5px 9px; margin-top:8px;}
  .callout{border:1px solid var(--ring); border-left:3px solid var(--accent); border-radius:10px; padding:10px 12px; font-size:13px; color:var(--ink-2); margin-top:10px; background:var(--surface-1);}
  .callout b{color:var(--ink-1);}
  .src{font-size:11px; color:var(--ink-3); margin-top:8px; line-height:1.5;}
  .src a{color:var(--ink-3);}
  /* tooltip */
  #tip{
    position:fixed; z-index:99; pointer-events:none; display:none;
    background:var(--surface-1); border:1px solid var(--ring); border-radius:9px;
    box-shadow:0 4px 14px rgba(0,0,0,.14); padding:8px 10px; font-size:12px; color:var(--ink-1);
    max-width:240px;
  }
  #tip .t{font-weight:650; margin-bottom:3px;}
  #tip .r{display:flex; justify-content:space-between; gap:12px; color:var(--ink-2);}
  #tip .r b{color:var(--ink-1); font-weight:600; font-variant-numeric:tabular-nums;}
  #tip .r .sw{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px;}
  svg text{font-family:inherit;}
  .chart-wrap{margin-top:8px;}
  .task-row{display:flex; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--grid); font-size:13.5px;}
  .task-row:last-child{border-bottom:none;}
  .task-row .pri{font-size:10.5px; font-weight:700; border-radius:5px; padding:2px 6px; flex:none;}
  .pri.P1{background:var(--wash); color:var(--accent);}
  .pri.P2{background:rgba(137,135,129,.15); color:var(--ink-2);}
  .task-row button.x{margin-left:auto; border:none; background:none; color:var(--ink-3); cursor:pointer; font-size:15px; flex:none;}
  .addrow{display:flex; gap:8px; margin-top:10px;}
  .addrow input{flex:1;}
  .bench-card{border:1px solid var(--ring); border-radius:11px; padding:10px 12px; margin-bottom:8px;}
  .bench-card .nm{font-weight:650; font-size:13.5px;}
  .bench-card .meta{font-size:12px; color:var(--ink-2); margin:2px 0 4px;}
  .bench-card .les{font-size:12.5px; color:var(--ink-2);}
  .bench-card .les b{color:var(--ink-1); font-weight:600;}
  details{border:1px solid var(--ring); border-radius:10px; padding:9px 12px; margin-top:8px;}
  details summary{font-size:13px; font-weight:600; color:var(--ink-2); cursor:pointer;}
  details[open] summary{margin-bottom:8px;}
  .stream-card{border:1px solid var(--ring); border-radius:11px; padding:10px 12px; margin-bottom:8px;}
  .stream-card .sh{display:flex; align-items:center; gap:8px;}
  .stream-card .sh .sw{width:11px; height:11px; border-radius:3px; flex:none;}
  .stream-card .sh .nm{font-weight:650; font-size:13.5px; flex:1;}
  .stream-card .sh input[type=checkbox]{width:17px; height:17px; accent-color:var(--accent);}
  .mini-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;}
  .mini-grid label.f{margin:0 0 3px;}
  .muted{color:var(--ink-3); font-size:12px;}
  .flex-between{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap;}

  /* v2 accessibility, execution, and responsive overrides */
  :root{
    --ink-3:#686762; --good:#087807; --accent:#2469b8;
    --focus:#8a4fff; --overlay:rgba(0,0,0,.50);
  }
  @media (prefers-color-scheme:dark){
    :root:where(:not([data-theme="light"])){
      --ink-3:#aaa9a2; --good:#49c749; --accent:#76aceb;
      --wash:rgba(118,172,235,.16);
    }
  }
  :root[data-theme="dark"]{
    --ink-3:#aaa9a2; --good:#49c749; --accent:#76aceb;
    --wash:rgba(118,172,235,.16);
  }
  button, input, select, textarea, summary{font:inherit;}
  button{min-height:40px;}
  button:focus-visible, input:focus-visible, select:focus-visible,
  textarea:focus-visible, summary:focus-visible, [tabindex]:focus-visible{
    outline:3px solid var(--focus); outline-offset:2px;
  }
  nav.tabs button.active{color:#fff;background:#155da8;border-color:#155da8;}
  :root[data-theme="dark"] nav.tabs button.active{color:#0b0b0b;background:#8bc0fa;border-color:#8bc0fa;}
  .theme-btn{min-height:40px;}
  .hero{overflow-wrap:anywhere;}
  .grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  @media(min-width:760px){.grid3{grid-template-columns:repeat(3,1fr)}.grid4{grid-template-columns:repeat(4,1fr);}}
  .today-card{border-left:4px solid var(--accent);}
  .task-title{font-size:15px;font-weight:650;line-height:1.35;}
  .task-meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;color:var(--ink-2);font-size:12px;}
  .task-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .task-actions button{padding:6px 10px;font-size:12px;}
  .task-detail{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-top:6px;}
  .status-chip,.type-chip,.impact-chip{
    display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;
    font-size:11px;font-weight:650;border:1px solid var(--ring);background:var(--surface-1);
  }
  .status-chip.complete,.status-chip.completed,.status-chip.validated{color:var(--good);}
  .status-chip.blocked{color:var(--ink-3);}
  .status-chip.waiting{color:#8a5500;}
  :root[data-theme="dark"] .status-chip.waiting{color:#ffd27d;}
  .impact-chip{color:var(--accent);background:var(--wash);}
  .locked{opacity:.70;}
  .task-card{border:1px solid var(--ring);border-radius:11px;padding:11px 12px;margin-top:8px;}
  .task-card.complete .task-title{text-decoration:line-through;color:var(--ink-3);}
  .task-tools{display:flex;gap:3px;flex-wrap:wrap;margin-left:auto;}
  .task-tools button{min-width:40px;padding:5px 8px;border:1px solid var(--ring);background:none;color:var(--ink-2);border-radius:8px;}
  .phase-grid{display:grid;gap:12px;}
  .progress-label{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2);margin-top:5px;}
  .evidence-row{display:grid;grid-template-columns:minmax(130px,1fr) 2fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--grid);font-size:12.5px;}
  .gate{border:1px solid var(--ring);border-radius:10px;padding:10px;margin-top:8px;}
  .gate.pass{border-left:4px solid var(--good);}
  .gate.fail{border-left:4px solid var(--axis);}
  .gate .gate-name{font-weight:650;}
  .gate .gate-detail{font-size:12px;color:var(--ink-2);margin-top:2px;}
  .impact-table td,.impact-table th{text-align:right;}
  .impact-table td:first-child,.impact-table th:first-child{text-align:left;}
  .notice{border:1px solid var(--ring);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--ink-2);}
  .notice.warn{border-left-color:var(--warn);}
  .notice.good{border-left-color:var(--good);}
  .bar-row{margin:9px 0;}
  .bar-label{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2);}
  .bar-track{height:12px;border-radius:7px;background:var(--seq-100);overflow:hidden;margin-top:3px;}
  .bar-track i{display:block;height:100%;background:var(--accent);border-radius:7px;}
  .modal-backdrop{position:fixed;inset:0;z-index:100;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal-backdrop[hidden]{display:none;}
  .modal-panel{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--surface-1);border:1px solid var(--ring);border-radius:16px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.28);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .modal-head h2{font-size:18px;}
  .modal-close{border:1px solid var(--ring);background:none;color:var(--ink-1);border-radius:8px;min-width:42px;}
  .field-help{display:block;font-size:11px;color:var(--ink-3);margin-top:2px;}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:110;background:var(--ink-1);color:var(--page);border-radius:10px;padding:9px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 5px 18px rgba(0,0,0,.25);font-size:13px;}
  .toast[hidden]{display:none;}
  .toast button{min-height:32px;background:none;color:inherit;border:1px solid currentColor;border-radius:7px;padding:3px 8px;}
  .source-list a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px;}
  .source-list li{display:block!important;}
  .error-text{color:var(--crit);font-size:12px;margin-top:5px;}
  .good-text{color:var(--good);}
  .warn-text{color:#8a5500;}
  :root[data-theme="dark"] .warn-text{color:#ffd27d;}
  .hdr-actions{display:flex;gap:6px;align-items:center;}
  .undo-btn[disabled]{opacity:.45;cursor:not-allowed;}
  .source-meta{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0;color:var(--ink-2);font-size:11.5px;}
  .source-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--good);}
  .ledger-item{border-left:3px solid var(--accent);padding:7px 9px;margin:7px 0;background:var(--wash);border-radius:0 8px 8px 0;font-size:12.5px;}
  .allocation-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;align-items:start;margin-top:8px;}
  .allocation-grid fieldset{border:1px solid var(--ring);border-radius:10px;padding:9px;margin:0;display:grid;gap:6px;}
  .allocation-grid legend{font-size:12px;font-weight:700;padding:0 4px;}
  .decision-bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;border-radius:10px;background:var(--wash);padding:10px;margin-top:10px;font-size:12px;color:var(--ink-2);}
  .chart-svg{width:100%;height:auto;display:block;}
  .icon-button{min-width:44px;min-height:44px;}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--page);border-color:var(--accent);font-weight:650;}
  .quick-add{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:8px;margin-top:10px;}
  .warning-list{margin:7px 0 0 18px;color:var(--ink-2);font-size:12.5px;}
  .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important;}
  @media(max-width:520px){
    main{padding-left:8px;padding-right:8px;}
    .card{padding:12px;}
    .grid2,.grid3,.grid4,.mini-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
    .grid2 > div:has(textarea),.grid4 > div:has(textarea){grid-column:1/-1;}
    .grid2 > div:has(textarea),.grid4 > div:has(textarea){grid-column:1/-1;}
    .hero{font-size:38px;}
    .quick-add{grid-template-columns:1fr 88px;}
    .quick-add button{grid-column:1/-1;}
    .addrow{flex-wrap:wrap;}
    .addrow input{flex-basis:100%;}
    .task-tools{width:100%;margin-top:6px;}
    .evidence-row{grid-template-columns:1fr;}
    .allocation-grid{grid-template-columns:1fr;}
    .hdr-actions{flex-direction:column;align-items:stretch;}
    table.data{font-size:12px;}
  }
</style>
</head>
<body>
<header class="app">
  <div class="hdr-row">
    <div>
      <h1>Present Stitch Biz Dashboard</h1>
      <div class="sub">Maggie&rsquo;s embroidery business &mdash; evidence &middot; execute &middot; decide</div>
    </div>
    <div class="hdr-actions"><button class="theme-btn undo-btn" id="undoBtn" data-action="undo" disabled aria-label="Nothing to undo">↶ Undo</button><button class="theme-btn" id="themeBtn">◐ Theme</button></div>
  </div>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="main"><noscript><div class="card" style="margin:14px">This dashboard needs JavaScript. Open the file in a regular browser (Safari, Chrome, Edge) and it will load fully.</div></noscript></main>
<div id="tip"></div>

<script>
"use strict";

/* Present Stitch Biz Dashboard v3
   Evidence-led execution, transparent planning value, and backward-compatible data. */

const APP_VERSION = 3;
const STORE_KEY = "psbd-v3";
const LEGACY_V2_KEY = "psbd-v2";
const LEGACY_KEY = "psbd-v1";
const APP_START = "2026-08-08";

function task(id, title, type, phaseId, dueDate, effortMinutes, definitionOfDone, why, options={}) {
  return {
    id, title, type, phaseId, dueDate, effortMinutes, definitionOfDone, why,
    priority: options.priority || "P2",
    dependsOn: options.dependsOn || [],
    status: options.status || "available",
    order: options.order || 0,
    points: options.points || (effortMinutes <= 30 ? 5 : effortMinutes <= 90 ? 10 : 20),
    result: options.result || "",
    resultClassification: options.resultClassification || "",
    decision: options.decision || "",
    evidenceAt: options.evidenceAt || "",
    metric: options.metric || null,
    impact: options.impact || null,
    evidenceLevel: options.evidenceLevel || "hypothesis",
    completedAt: options.completedAt || "",
    pointsAwarded: Boolean(options.pointsAwarded),
    evidenceBonusAwarded: Boolean(options.evidenceBonusAwarded),
    seasonal: Boolean(options.seasonal),
    milestone: options.milestone || "",
    imported: Boolean(options.imported)
  };
}

  const keywordMap=[

    [/finance|tracking|tracker/i,"launch-finance"],[/capacity|order limit|cutoff/i,"launch-limits"],[/pattern/i,"traction-pattern"],
    [/workshop/i,"scale-workshop"],[/wholesale/i,"scale-wholesale"],[/full.?time|quit/i,"fulltime-decision"]

function pricingDetails(stream,price=stream.p){
  const pct=clamp(stream.cogs,0,100)+clamp(stream.fees,0,100)+clamp(stream.offsiteRate,0,100);
  const fixed=number(stream.fixedFee)+number(stream.listingFee)+number(stream.packaging)+number(stream.shipping)+number(stream.rework);

  const feasible=pct<100,denominator=1-pct/100;
  return {pct,fixed,contribution,perHour:stream.hpu>0?contribution/stream.hpu:contribution,feasible,denominator};
}

function eligibleStreams(data,scope){

function runModel(data=S,scenKey=data.settings.scenario,scope="core"){
  const st=data.settings, scen=SCENARIOS[scenKey]||SCENARIOS.base, horizon=st.horizon;
  const streams=eligibleStreams(data,scope); const years=[]; let npv=0, infeasible=false;const infeasibleFees=new Set();
  const effStart=s=>number(s.start,1)+(number(s.start,1)>1?scen.delay:0);
  for(let yi=0;yi<horizon;yi++){
    const y=yi+1, hpw=Math.min(st.maxHpw,number(st.hours[Math.min(yi,st.hours.length-1)],0));
    const avail=Math.max(0,hpw*52); const active=streams.filter(s=>y>=effStart(s));
    const fixedStream=active.reduce((sum,s)=>sum+(y===effStart(s)?number(s.fh):0)+number(s.rh),0);
    const fixedHours=number(st.adminH)+fixedStream; let remaining=Math.max(0,avail-fixedHours);
    if(fixedHours>avail) infeasible=true;
    const offers=active.map(s=>{
      const age=Math.max(0,y-effStart(s));
      const units=Math.max(0,number(s.u)*12*scen.u*Math.pow(Math.max(0,1+(number(s.ug)*scen.g)/100),age));
      const price=Math.max(0,number(s.p)*scen.p*Math.pow(Math.max(0,1+number(s.pg)/100),age));
      const pd=pricingDetails(s,price);
      if(!pd.feasible)infeasibleFees.add(s.name);
      return {s,units,price,pd,rank:st.capacityMode==="strategic"?-number(s.priority,99):pd.perHour};
    }).sort((a,b)=>b.rank-a.rank||a.s.id.localeCompare(b.s.id));

    const allocation=[];
    offers.forEach(o=>{

      const fulfill=fixedHours>avail||!o.pd.feasible||o.pd.contribution<=0?0:(o.s.hpu<=0?o.units:Math.min(o.units,remaining/number(o.s.hpu,1)));

    });
    const overhead=number(st.ohm)*12*Math.pow(Math.max(0,1+number(st.ohg)/100),yi);

    const sde=revenue-variableCost-overhead-oneTime;
    const recovery=yi===horizon-1?number(st.workingCapital)*number(st.workingCapitalRecoveryPct)/100:0;
    const cashFlow=sde+recovery;
    const used=fixedHours+variableHours;
    const df=Math.pow(1+number(st.r)/100,y); npv+=cashFlow/df;
    years.push({y,hpw,avail,fixedHours,used,util:avail?used/avail:0,revenue,variableCost,overhead,oneTime,recovery,cashFlow,sde,wage:used>0?sde/used:0,lostRevenue,fulfilledUnits,demandUnits,allocation,infeasible:fixedHours>avail});
  }

    terminal=normalized*number(st.tv); npv+=terminal/Math.pow(1+number(st.r)/100,horizon);
  }
  const warnings=[infeasible?"Fixed/admin hours exceed available capacity in at least one year.":"",infeasibleFees.size?`Percentage costs reach or exceed 100% for: ${[...infeasibleFees].join(", ")}. No sales are fulfilled for those streams.`:""].filter(Boolean);
  return {scope,scenario:scenKey,years,npv,terminal,infeasible:infeasible||infeasibleFees.size>0,infeasibleFees:[...infeasibleFees],warnings};
}

  const full=run.length>=need,provisional=!full&&run.length>=provisionalNeed,windowRows=run.slice(-(full?need:Math.min(run.length,provisionalNeed)));

    {id:"earnings",name:"Owner-earnings threshold",pass:earningsPass,detail:`${windowRows.length}-month average ${formatMoney(avgEarnings)}/mo; requires ${formatMoney(required)}/mo (${st.readinessPct}% of target). Full history is required.`},
    {id:"hours",name:"Sustainable working hours",pass:sustainable,detail:`Average ${avgHpw.toFixed(1)} hrs/week; peak ${maxObserved.toFixed(1)} vs ${st.readinessMaxHpw} readiness maximum.`},
    {id:"fund",name:"Emergency fund",pass:Boolean(data.ready.fund),detail:"User-confirmed six-month personal emergency fund."},
    {id:"insurance",name:"Health insurance",pass:Boolean(data.ready.insurance),detail:"User-confirmed plan is priced and selected."},
    {id:"tax",name:"Taxes and benefits",pass:Boolean(data.ready.taxBenefits),detail:"User-confirmed taxes, retirement, leave, and lost benefits are budgeted."},

function actualsSuggestion(streamId){const stream=S.streams.find(x=>x.id===streamId);if(!stream)return null;const rows=trackerRows(3,{closedOnly:true}).map(r=>({m:r.m,...(r.byStream&&r.byStream[streamId]||{})})).filter(r=>number(r.orders)>0);if(!rows.length)return {stream,rows:[],months:0,orders:0};const orders=rows.reduce((a,r)=>a+number(r.orders),0),rev=rows.reduce((a,r)=>a+number(r.rev),0),hrs=rows.reduce((a,r)=>a+number(r.hrs),0);return {stream,rows,months:rows.length,u:orders/rows.length,p:orders?rev/orders:stream.p,hpu:orders?hrs/orders:stream.hpu,orders};}

function chartTicks(min,max,maxTicks=7){
  if(!Number.isFinite(min)||!Number.isFinite(max))return {ticks:[0,1],lo:0,hi:1};
  min=Math.min(min,0);max=Math.max(max,0);if(min===max){min-=1;max+=1;}
  const range=max-min,raw=range/Math.max(2,maxTicks-1),mag=Math.pow(10,Math.floor(Math.log10(raw))),fraction=raw/mag;
  const nice=fraction<=1?1:fraction<=2?2:fraction<=2.5?2.5:fraction<=5?5:10;let step=nice*mag;
  let lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;
  while(Math.round((hi-lo)/step)+1>maxTicks){step*=2;lo=Math.floor(min/step)*step;hi=Math.ceil(max/step)*step;}
  const count=Math.round((hi-lo)/step),ticks=Array.from({length:count+1},(_,i)=>Math.abs(lo+i*step)<step*1e-9?0:lo+i*step);
  return {ticks,lo,hi};
}
function valuationChart(model,id){
  const vals=model.years.map(y=>y.sde),domain=chartTicks(Math.min(...vals,0),Math.max(...vals,0),7),{ticks,lo}=domain,top=domain.hi;
  const w=640,h=248,padL=66,padR=14,padT=12,padB=26,iw=w-padL-padR,ih=h-padT-padB;
  const yPos=v=>padT+ih*(1-(v-lo)/(top-lo||1));
  const grid=ticks.map(t=>`<line x1="${padL}" y1="${yPos(t).toFixed(1)}" x2="${w-padR}" y2="${yPos(t).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/><text x="${padL-7}" y="${(yPos(t)+4).toFixed(1)}" text-anchor="end" font-size="11.5" fill="var(--ink-3)">${formatMoney(t)}</text>`).join("");
  const bw=Math.min(26,iw/model.years.length*.55);
  const bars=model.years.map((y,i)=>{
    const x=padL+(i+.5)*iw/model.years.length-bw/2, y0=yPos(0), yV=yPos(y.sde);
    const rectY=Math.min(y0,yV), bh=Math.max(1,Math.abs(y0-yV));
    const label=i===model.years.length-1?`<text x="${(x+bw/2).toFixed(1)}" y="${(yV+(y.sde>=0?-6:14)).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink-1)">${formatMoney(y.sde)}</text>`:"";
    return `<rect x="${x.toFixed(1)}" y="${rectY.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="var(--accent)"><title>Year ${y.y}: ${formatMoney(y.sde,false)} owner earnings</title></rect>${label}<text x="${(x+bw/2).toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="12" fill="var(--ink-2)">Y${y.y}</text>`;
  }).join("");
  return `<figure class="chart-wrap"><svg class="chart-svg" viewBox="0 0 ${w} ${h}" role="img" aria-labelledby="${id}-title ${id}-desc"><title id="${id}-title">Projected annual owner earnings</title><desc id="${id}-desc">Bars show annual owner earnings after variable costs, overhead, and one-time costs for each modeled year; the axis shows dollar values.</desc>${grid}<line x1="${padL}" y1="${yPos(0).toFixed(1)}" x2="${w-padR}" y2="${yPos(0).toFixed(1)}" stroke="var(--axis)" stroke-width="1"/>${bars}</svg><figcaption class="muted">Owner earnings by modeled year. Exact values are in the table below.</figcaption></figure>`;
}

  if(lastInputEl!==x){ snapshotForUndo(`edit ${x.dataset.setting||x.dataset.streamField||x.dataset.trackerField||"value"}`); lastInputEl=x; }

  else { lastInputEl=null; return; }
  save(); clearTimeout(liveTimer); liveTimer=setTimeout(refreshLive,220);

function selfTests(){
  const out=[];const push=(name,pass,detail)=>out.push({name,pass:Boolean(pass),detail});
  try{
    let capOk=true,sumOk=true,lostOk=true,npvOk=true,finOk=true;
    ["core","full"].forEach(scope=>["cons","base","stretch"].forEach(k=>{
      const m=runModel(S,k,scope);
      if(!Number.isFinite(m.npv))finOk=false;
      m.years.forEach(y=>{
        if(y.used>y.avail+1e-6)capOk=false;
        if(Math.abs(y.revenue-y.allocation.reduce((a,x)=>a+x.revenue,0))>0.01)sumOk=false;
        if(y.lostRevenue<-1e-6)lostOk=false;
      });
      const r=S.settings.r/100;
      const npv2=m.years.reduce((a,y)=>a+y.cashFlow/Math.pow(1+r,y.y),0)+(m.terminal?m.terminal/Math.pow(1+r,S.settings.horizon):0);
      if(Math.abs(npv2-m.npv)>0.01)npvOk=false;
    }));
    push("Fulfilled hours never exceed available capacity",capOk,"Checked every year of all six scenario/scope runs.");
    push("Revenue equals the sum of stream allocations",sumOk,"Cross-footed each modeled year.");
    push("Unserved demand is never negative",lostOk,"Allocation cannot fulfill more than demand.");
    push("NPV re-derives from the year table",npvOk,"Discounted cash flows plus terminal value reproduce the headline.");
    push("All model outputs are finite numbers",finOk,"No NaN or Infinity in any scenario.");
    const a=mergeState(deepClone(S)),b=mergeState(deepClone(a));
    push("State normalization is stable",JSON.stringify(a.settings)===JSON.stringify(b.settings)&&a.streams.length===b.streams.length&&a.tasks.length===b.tasks.length&&a.tracker.length===b.tracker.length,"Normalizing twice changes nothing — guards schema drift after edits.");
    const nowSerial=monthSerial(todayISO().slice(0,7));
    push("No future month is marked as logged actuals",S.tracker.every(r2=>!r2.logged||!validMonth(r2.m)||monthSerial(r2.m)<=nowSerial),"The condition that once wiped saved data can no longer persist.");
    let acyclic=true;
    try{const seen=new Set(),visiting=new Set();const walk=id=>{if(visiting.has(id)){acyclic=false;return;}if(seen.has(id))return;visiting.add(id);const t=S.tasks.find(x=>x.id===id);(t?t.dependsOn:[]).forEach(walk);visiting.delete(id);seen.add(id);};S.tasks.forEach(t=>walk(t.id));}catch(e){acyclic=false;}
    push("Task dependency graph has no cycles",acyclic,"Every task remains completable.");
    const d=chartTicks(-500,12345,7);
    push("Chart axis always covers the data range",d.lo<=-500&&d.hi>=12345,"Bars can never overflow the plot.");
  }catch(e){push("Self-test runner",false,String(e&&e.message||e));}
  return out;
}

function nextLogMonth(){
  const logged=trackerRows();
  if(!logged.length) return todayISO().slice(0,7);
  const last=monthSerial(logged[logged.length-1].m), cur=monthSerial(todayISO().slice(0,7));
  const next=Math.min(last+1,cur), y=Math.floor((next-1)/12), mo=next-y*12;
  return `${y}-${String(mo).padStart(2,"0")}`;
}
function shiftISO(iso,days){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(iso||""))) return iso;
  const d=new Date(`${iso}T12:00:00`); d.setDate(d.getDate()+days);
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

    if(!validMonth(m)){showToast("Pick a valid month first");return;}if(monthSerial(m)>monthSerial(todayISO().slice(0,7))){showToast("A future month cannot be logged as actuals");return;}
    const i=S.tracker.findIndex(r=>r.m===m);if(i>=0&&!confirm(`Replace the seven quick-log fields for ${m}? Detailed funnel, readiness, notes, and stream allocations will be preserved.`))return;snapshotForUndo(`quick log ${m}`);
    const vals={m,logged:true,rev:number(fd.get("rev"),0),cost:number(fd.get("cost"),0),hrs:number(fd.get("hrs"),0),orders:number(fd.get("orders"),0),fol:number(fd.get("fol"),0),email:number(fd.get("email"),0)};
    if(i>=0)S.tracker[i]=normalizeTrackerRow(Object.assign({},S.tracker[i],vals));
    else S.tracker.push(normalizeTrackerRow(vals));
    S.tracker.sort((a,b)=>a.m.localeCompare(b.m));
    save();renderCurrent();showToast(`${m} logged`,true);return;
  }
  if(e.target.id==="shift-dates-form"){
    e.preventDefault();const days=Math.round(clamp(new FormData(e.target).get("days"),-365,365));
    if(!days){showToast("Enter a number of days (±)");return;}
    snapshotForUndo(`shift dates by ${days} days`);
    S.tasks.forEach(t=>{
      if(isComplete(t))return;
      if(t.dueDate)t.dueDate=shiftISO(t.dueDate,days);
      if(t.metric&&t.metric.reviewDate)t.metric.reviewDate=shiftISO(t.metric.reviewDate,days);
    });
    S.phases.forEach(ph=>{
      if(ph.start)ph.start=shiftISO(ph.start,days);
      if(ph.end)ph.end=shiftISO(ph.end,days);
      if(ph.start&&ph.end)ph.when=`${dateLabel(ph.start)} – ${dateLabel(ph.end)}`;
    });
    save();renderCurrent();showToast(`Open dates shifted ${days>0?"+":""}${days} days`,true);return;
  }
  if(e.target.id==="add-month-form"){
    e.preventDefault();const m=String(new FormData(e.target).get("month")||"");if(!validMonth(m)){showToast("Choose a valid month");return;}
    if(S.tracker.some(r=>r.m===m)){showToast("That month already exists");return;}
    snapshotForUndo("add tracker month");S.tracker.push(normalizeTrackerRow({m,logged:false}));S.tracker.sort((a,b)=>a.m.localeCompare(b.m));save();renderCurrent();showToast("Month added",true);
  }
}

function switchTab(id,focusTab=false){
  if(!RENDER[id])return;currentTab=id;
  document.querySelectorAll('[role="tab"]').forEach(b=>{const active=b.dataset.tab===id;b.classList.toggle("active",active);b.setAttribute("aria-selected",String(active));b.tabIndex=active?0:-1;if(active&&focusTab)b.focus();});
  document.querySelectorAll('[role="tabpanel"]').forEach(p=>{const active=p.id===`panel-${id}`;p.classList.toggle("active",active);p.hidden=!active;});
  renderCurrent();window.scrollTo({top:0,behavior:"auto"});
}
function renderCurrent(){
  const el=document.getElementById(`panel-${currentTab}`);if(el&&RENDER[currentTab])RENDER[currentTab](el);save();
}
function findTask(id){return S.tasks.find(t=>t.id===id);}
function removeTask(id){S.tasks.forEach(t=>{t.dependsOn=t.dependsOn.filter(d=>d!==id);});S.tasks=S.tasks.filter(t=>t.id!==id);}
function revokeTaskAward(t){const removed=S.momentum.history.filter(x=>x.taskId===t.id),points=removed.reduce((a,x)=>a+number(x.points),0),thisWeek=removed.filter(x=>weekKey(new Date(x.at))===S.momentum.weekKey).reduce((a,x)=>a+number(x.points),0);S.momentum.history=S.momentum.history.filter(x=>x.taskId!==t.id);S.momentum.total=Math.max(0,S.momentum.total-points);S.momentum.weekPoints=Math.max(0,S.momentum.weekPoints-thisWeek);t.pointsAwarded=false;t.evidenceBonusAwarded=false;}
function hasDependencyCycle(id,deps){
  const seen=new Set();function walk(x){if(x===id)return true;if(seen.has(x))return false;seen.add(x);const t=findTask(x);return t?t.dependsOn.some(walk):false;}
  return deps.some(walk);
}

async function copyText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){try{await navigator.clipboard.writeText(text);return true;}catch(e){}}
  const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy");}catch(e){}ta.remove();return ok;
}

function handleAction(e){
  const b=e.target.closest&&e.target.closest("[data-action]");if(!b)return;const action=b.dataset.action,id=b.dataset.id;
  if(action==="undo"){undo();return;}
  if(action==="close-modal"){closeModal();return;}
  if(action==="open-roadmap"){switchTab("roadmap");return;}
  if(action==="open-tracker"){switchTab("tracker");return;}
  if(action==="open-data"){switchTab("data");return;}
  if(action==="rerun-tests"){renderCurrent();showToast("Self-tests re-run");return;}
  if(action==="dismiss-migration"){S.meta.migrationNotice=false;save();renderCurrent();return;}
  if(action==="set-scenario"){snapshotForUndo("change scenario");S.settings.scenario=b.dataset.value;save();renderCurrent();showToast(`Scenario: ${SCENARIOS[S.settings.scenario].label}`,true);return;}
  if(action==="capacity-mode"){snapshotForUndo("change capacity allocation");S.settings.capacityMode=b.dataset.value;save();renderCurrent();showToast("Capacity allocation updated",true);return;}
  if(action==="task-start"){const t=findTask(id);if(!t)return;if(taskState(t)==="blocked"){showToast("Complete the dependencies first");return;}snapshotForUndo(`start ${t.title}`);t.status="active";save();renderCurrent();showToast("Task started",true);return;}
  if(action==="task-done"){const t=findTask(id);if(!t)return;if(t.type!=="action")openResultEditor(t);else completeTask(t);return;}
  if(action==="task-result"){const t=findTask(id);if(t)openResultEditor(t);return;}
  if(action==="task-reopen"){const t=findTask(id);if(!t)return;snapshotForUndo(`reopen ${t.title}`);revokeTaskAward(t);t.status="active";t.completedAt="";save();renderCurrent();showToast("Task reopened; its points were reversed",true);return;}
  if(action==="task-edit"){const t=findTask(id);if(t)openTaskEditor(t);return;}
  if(action==="task-duplicate"){
    const t=findTask(id);if(!t)return;snapshotForUndo(`duplicate ${t.title}`);const copy=deepClone(t);copy.id=uid();copy.title=`${t.title} (copy)`;copy.status="available";copy.completedAt="";copy.result="";copy.resultClassification="";copy.decision="";copy.evidenceAt="";copy.pointsAwarded=false;copy.evidenceBonusAwarded=false;copy.order=t.order+1;copy.milestone="";S.tasks.push(normalizeTask(copy,null,S.phases.map(p=>p.id)));save();renderCurrent();showToast("Task duplicated",true);return;
  }
  if(action==="task-move"){
    const t=findTask(id);if(!t)return;const list=S.tasks.filter(x=>x.phaseId===t.phaseId).sort((a,c)=>a.order-c.order);const i=list.indexOf(t),j=i+Number(b.dataset.dir);if(j<0||j>=list.length)return;
    snapshotForUndo(`reorder ${t.title}`);list.forEach((x,n)=>x.order=(n+1)*10);const old=t.order;t.order=list[j].order;list[j].order=old;save();renderCurrent();showToast("Task reordered",true);return;
  }
  if(action==="task-delete"){
    const t=findTask(id);if(!t)return;const dependents=S.tasks.filter(x=>x.dependsOn.includes(id));if(dependents.length){showToast(`Cannot delete: used by ${dependents.map(x=>x.title).join(", ")}`);return;}if(!confirm(`Delete “${t.title}”?`))return;snapshotForUndo(`delete ${t.title}`);removeTask(id);save();renderCurrent();showToast("Task deleted",true);return;
  }
  if(action==="apply-fee-profile"){
    const s=S.streams.find(x=>x.id===id);if(!s)return;snapshotForUndo(`apply ${s.channel} fee profile`);
    if(s.channel==="etsy"){s.fees=9.5;s.fixedFee=.25;s.listingFee=.20;}else{s.fees=2.9;s.fixedFee=.30;s.listingFee=0;s.offsiteRate=0;}
    save();renderCurrent();showToast("Standard fee profile applied",true);return;
  }
  if(action==="delete-month"){
    const i=Number(b.dataset.index),r=S.tracker[i];if(!r||!confirm(`Delete tracker month ${r.m}?`))return;snapshotForUndo(`delete ${r.m}`);S.tracker.splice(i,1);save();renderCurrent();showToast("Month deleted",true);return;
  }
  if(action==="accept-suggestion"){
    const sug=actualsSuggestion(id);if(!sug||!sug.orders)return;snapshotForUndo(`update ${sug.stream.name} from actuals`);sug.stream.u=Math.round(sug.u*10)/10;sug.stream.p=Math.round(sug.p*100)/100;sug.stream.hpu=Math.round(sug.hpu*100)/100;const byMonth=new Map();S.actualApplications.filter(a=>a.streamId===id).forEach(a=>(a.months||[]).forEach(x=>byMonth.set(x.m,{m:x.m,orders:number(x.orders)})));sug.rows.forEach(r=>byMonth.set(r.m,{m:r.m,orders:number(r.orders)}));S.actualApplications=S.actualApplications.filter(a=>a.streamId!==id);S.actualApplications.push({id:uid("actual"),streamId:id,months:[...byMonth.values()].sort((a,b)=>a.m.localeCompare(b.m)),at:new Date().toISOString()});sug.stream.evidenceLevel=observationCount(id)>=5?"observed":"hypothesis";S.evidenceLedger.push({id:uid("evidence"),at:new Date().toISOString(),week:weekKey(),kind:"actual-to-plan",title:`Updated ${sug.stream.name} assumptions`,summary:`Accepted ${sug.orders} attributed orders from ${sug.rows.map(r=>r.m).join(", ")}.`,classification:sug.orders>=5?"observed":"preliminary"});save();renderCurrent();showToast("Accepted once by stream and month",true);return;
  }
  if(action==="use-suggested-target"){snapshotForUndo("use target worksheet");S.settings.target=Math.round(suggestedTarget());save();renderCurrent();showToast("Worksheet target applied",true);return;}
  if(action==="copy-json"){
    S.meta.lastBackup=todayISO();save();
    const text=JSON.stringify(S,null,2);copyText(text).then(ok=>showToast(ok?"Snapshot copied":"Could not copy; select the snapshot manually"));return;
  }
  if(action==="download-json"){
    S.meta.lastBackup=todayISO();save();
    const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`present-stitch-v3-${todayISO()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);showToast("Snapshot downloaded");return;
  }
  if(action==="reset-data"){
    if(!confirm("Reset the v3 dashboard to built-in defaults? Older v1/v2 records will not be deleted."))return;snapshotForUndo("reset v3 data");S=mergeState(DEFAULTS);saveNow();applyTheme();renderCurrent();showToast("v3 defaults restored",true);return;
  }
  if(action==="import-json"){
    const msg=document.getElementById("import-message"),ta=document.getElementById("import-json");
    try{const candidate=validateSnapshotObject(JSON.parse(ta.value));snapshotForUndo("restore snapshot");S=candidate;saveNow();applyTheme();renderCurrent();showToast("Snapshot restored",true);}catch(err){if(msg){msg.textContent=err instanceof SyntaxError?"Invalid JSON. Paste the complete exported snapshot.":err.message;msg.className="error-text";}}
  }
}

function handleDocumentSubmit(e){
  if(e.target.id==="task-editor-form"){
    e.preventDefault();const f=e.target,id=f.dataset.id,existing=findTask(id),deps=[...f.querySelectorAll('input[name="dependency"]:checked')].map(x=>x.value);
    if(hasDependencyCycle(id,deps)){let err=f.querySelector(".error-text");if(!err){err=document.createElement("div");err.className="error-text";err.setAttribute("role","alert");f.appendChild(err);}err.textContent="Those dependencies create a cycle. Remove the circular link.";return;}
    snapshotForUndo(existing?`edit ${existing.title}`:"add task");
    const base=existing||normalizeTask({id,title:"",phaseId:currentPhaseId(),order:Math.max(0,...S.tasks.map(t=>t.order))+10});const wasComplete=isComplete(base);
    const metricName=f.querySelector("#edit-metric-name").value.trim(),metric=metricName?{name:metricName,baseline:f.querySelector("#edit-metric-baseline").value.trim(),target:f.querySelector("#edit-metric-target").value.trim(),exposure:f.querySelector("#edit-metric-exposure").value.trim(),decisionRule:f.querySelector("#edit-metric-rule").value.trim(),reviewDate:f.querySelector("#edit-metric-date").value}:null;
    Object.assign(base,{title:f.querySelector("#edit-title").value.trim(),type:f.querySelector("#edit-type").value,phaseId:f.querySelector("#edit-phase").value,priority:f.querySelector("#edit-priority").value,dueDate:f.querySelector("#edit-due").value,effortMinutes:number(f.querySelector("#edit-effort").value,30),definitionOfDone:f.querySelector("#edit-dod").value.trim(),why:f.querySelector("#edit-why").value.trim(),dependsOn:deps,seasonal:f.querySelector("#edit-seasonal").checked,metric});
    if(!wasComplete&&base.status==="waiting"&&base.type==="action")base.status="available";const cleaned=normalizeTask(base,base,S.phases.map(p=>p.id));if(existing)Object.assign(existing,cleaned);else S.tasks.push(cleaned);
    closeModal();save();renderCurrent();showToast(existing?"Task updated":"Task added",true);return;
  }
  if(e.target.id==="task-result-form"){
    e.preventDefault();const t=findTask(e.target.dataset.id);if(t){completeTask(t,{result:e.target.querySelector("#result-text").value,classification:e.target.querySelector("#result-classification").value,decision:e.target.querySelector("#result-decision").value,date:e.target.querySelector("#result-date").value});}return;
  }
}

function systemIsDark(){return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;}
function applyTheme(){
  const theme=S.settings.theme||"auto",root=document.documentElement;if(theme==="auto")root.removeAttribute("data-theme");else root.setAttribute("data-theme",theme);
  const dark=theme==="dark"||(theme==="auto"&&systemIsDark());const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=dark?"#0d0d0d":"#f9f9f7";
  const b=document.getElementById("themeBtn");if(b){b.textContent=`◐ ${theme[0].toUpperCase()+theme.slice(1)}`;b.setAttribute("aria-label",`Theme: ${theme}. Activate to change theme.`);}
}
function cycleTheme(){const order=["auto","light","dark"],i=order.indexOf(S.settings.theme);snapshotForUndo("change theme");S.settings.theme=order[(i+1)%order.length];applyTheme();save();showToast(`Theme: ${S.settings.theme}`,true);}

function init(){
  S=loadState();S=mergeState(S);refreshMomentumWeek();applyTheme();
  const nav=document.getElementById("tabs"),main=document.getElementById("main");
  nav.setAttribute("role","tablist");nav.setAttribute("aria-label","Dashboard sections");
  nav.innerHTML=TABS.map(t=>`<button id="tab-${t.id}" role="tab" aria-controls="panel-${t.id}" aria-selected="${t.id===currentTab}" tabindex="${t.id===currentTab?0:-1}" data-tab="${t.id}" class="${t.id===currentTab?"active":""}">${esc(t.label)}</button>`).join("");
  main.innerHTML=TABS.map(t=>`<section id="panel-${t.id}" class="tab ${t.id===currentTab?"active":""}" role="tabpanel" aria-labelledby="tab-${t.id}" ${t.id===currentTab?"":"hidden"}></section>`).join("");
  if(!document.getElementById("modal"))document.body.insertAdjacentHTML("beforeend",`<div id="modal" class="modal-backdrop" hidden><div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div></div><div id="toast" class="toast" role="status" aria-live="polite" hidden></div>`);
  nav.addEventListener("click",e=>{const b=e.target.closest('[role="tab"]');if(b)switchTab(b.dataset.tab);});
  nav.addEventListener("keydown",e=>{const tabs=[...nav.querySelectorAll('[role="tab"]')],i=tabs.indexOf(e.target);if(i<0)return;let j;if(e.key==="ArrowRight")j=(i+1)%tabs.length;else if(e.key==="ArrowLeft")j=(i-1+tabs.length)%tabs.length;else if(e.key==="Home")j=0;else if(e.key==="End")j=tabs.length-1;else return;e.preventDefault();switchTab(tabs[j].dataset.tab,true);});
  main.addEventListener("change",handleMainChange);main.addEventListener("input",handleMainInput);main.addEventListener("submit",handleMainSubmit);
  document.addEventListener("click",handleAction);document.addEventListener("submit",handleDocumentSubmit);
  document.getElementById("themeBtn").addEventListener("click",cycleTheme);
  document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
  document.addEventListener("keydown",e=>{
    const modal=document.getElementById("modal");if(!modal||modal.hidden)return;if(e.key==="Escape"){e.preventDefault();closeModal();return;}if(e.key!=="Tab")return;
    const focus=[...modal.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')];if(!focus.length)return;const first=focus[0],last=focus[focus.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  });
  if(window.matchMedia)window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{if(S.settings.theme==="auto")applyTheme();});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")saveNow();});window.addEventListener("pagehide",saveNow);
  updateUndoButton();renderCurrent();
}


if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();

</script>
